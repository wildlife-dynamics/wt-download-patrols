sql-filter:
  name: SQL Filter Patrols by Speed
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Tracks Events Workflow"
      description: "Filter patrol trajectories by speed using SQL."
    er_client_name:
      data_source:
        name: "mep_dev"
    time_range:
      since: "2015-01-10T00:00:00Z"
      until: "2015-02-28T23:59:59Z"
      timezone:
        label: "Africa/Nairobi (UTC+03:00)"
        tzCode: "Africa/Nairobi"
        name: "(UTC+03:00) Nairobi"
        utc: "+03:00"
    er_patrol_and_events_params:
      patrol_types: ["ecoscope_patrol"]
      status: ["done"]
      event_types: []
      include_null_geometry: false
    patrol_filters:
      filter_point_coords:
        - {x: 180.0, y: 90.0}
        - {x: 0.0, y: 0.0}
        - {x: 1.0, y: 1.0}
      trajectory_segment_filter:
        min_length_meters: 0.001
        max_length_meters: 10000.0
        max_time_secs: 3600.0
        min_time_secs: 1.0
        max_speed_kmhr: 120.0
        min_speed_kmhr: 0.01
    set_patrol_traj_color_column:
      var: "patrol_subject"
    set_patrol_event_color_column:
      var: "event_type"
    sql_query_traj:
      # sanitize (default-on) makes the columns whitelist unnecessary; SQL runs
